.deploy-lambda-container:
  image: amazon/aws-cli:2
  before_script:
    - aws --version
    - |
      if [ -z "${AWS_REGION:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
        echo "Missing AWS credentials (AWS_REGION/AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)" >&2
        exit 1
      fi
      if [ -z "${LAMBDA_FUNCTION_NAME:-}" ] || [ -z "${IMAGE_URI:-}" ]; then
        echo "Missing LAMBDA_FUNCTION_NAME/IMAGE_URI" >&2
        exit 1
      fi
  script:
    - |
      set -euo pipefail
      aws lambda update-function-code \
        --function-name "${LAMBDA_FUNCTION_NAME}" \
        --image-uri "${IMAGE_URI}" \
        --region "${AWS_REGION}"

