.docker-to-ecr:
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - apk add --no-cache aws-cli
    - docker info
    - |
      if [ -z "${AWS_REGION:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
        echo "Missing AWS credentials (AWS_REGION/AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)" >&2
        exit 1
      fi
      if [ -z "${AWS_ACCOUNT_ID:-}" ]; then
        echo "Missing AWS_ACCOUNT_ID" >&2
        exit 1
      fi
      if [ -z "${IMAGE_NAME:-}" ] || [ -z "${DOCKERFILE:-}" ] || [ -z "${CONTEXT:-}" ]; then
        echo "Missing IMAGE_NAME/DOCKERFILE/CONTEXT" >&2
        exit 1
      fi
  script:
    - |
      set -euo pipefail

      ECR_PREFIX="${ECR_REPO_PREFIX:-app}"
      ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      ECR_REPO="${ECR_PREFIX}/${IMAGE_NAME}"
      ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPO}"

      TAG="${IMAGE_TAG:-${CI_COMMIT_SHA}}"

      aws ecr describe-repositories --repository-names "${ECR_REPO}" --region "${AWS_REGION}" >/dev/null 2>&1 || \
        aws ecr create-repository --repository-name "${ECR_REPO}" --region "${AWS_REGION}" >/dev/null

      aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      docker build -f "${DOCKERFILE}" -t "${ECR_IMAGE}:${TAG}" "${CONTEXT}"
      docker push "${ECR_IMAGE}:${TAG}"

