name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm teardown of all AWS resources"
        required: true

env:
  AWS_REGION: us-east-1
  TF_ROOT: infra/terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-destroy:
    name: terraform:destroy
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DESTROY' }}
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_database_url: ${{ secrets.TF_VAR_DATABASE_URL }}
      TF_VAR_redis_url: ${{ secrets.TF_VAR_REDIS_URL }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      TF_VAR_dev_jwt_secret: ${{ secrets.TF_VAR_DEV_JWT_SECRET }}
      TF_VAR_encryption_key: ${{ secrets.TF_VAR_ENCRYPTION_KEY }}
      TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_GEMINI_API_KEY }}
      TF_VAR_admin_ssh_cidr: ${{ secrets.TF_VAR_ADMIN_SSH_CIDR }}
      TF_VAR_ai_provider: gemini
      TF_VAR_llm_model: gemini-1.5-flash
      TF_VAR_app_env: staging
      TF_VAR_s3_bucket_resumes: autodream-resumes-prod
      TF_VAR_s3_bucket_screenshots: autodream-screenshots-prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.7.0" }
      - run: terraform init
        working-directory: ${{ env.TF_ROOT }}
      - run: terraform destroy -auto-approve
        working-directory: ${{ env.TF_ROOT }}
