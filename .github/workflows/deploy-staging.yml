name: Deploy to Staging

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build and push api-gateway
        run: |
          docker build -t $ECR_REGISTRY/api-gateway:$IMAGE_TAG -f docker/api-gateway/Dockerfile .
          docker push $ECR_REGISTRY/api-gateway:$IMAGE_TAG

      - name: Build and push apply-engine
        run: |
          docker build -t $ECR_REGISTRY/apply-engine:$IMAGE_TAG -f docker/apply-engine/Dockerfile .
          docker push $ECR_REGISTRY/apply-engine:$IMAGE_TAG

      - name: Build and push job-discovery
        run: |
          docker build -t $ECR_REGISTRY/job-discovery:$IMAGE_TAG -f docker/job-discovery/Dockerfile .
          docker push $ECR_REGISTRY/job-discovery:$IMAGE_TAG

      - name: Deploy api-gateway to ECS
        run: |
          aws ecs update-service \
            --cluster autodreamapplier-staging \
            --service api-gateway \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Deploy apply-engine to ECS
        run: |
          aws ecs update-service \
            --cluster autodreamapplier-staging \
            --service apply-engine \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Deploy job-discovery to ECS
        run: |
          aws ecs update-service \
            --cluster autodreamapplier-staging \
            --service job-discovery \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster autodreamapplier-staging \
            --services api-gateway apply-engine job-discovery \
            --region $AWS_REGION

      - name: Smoke test staging
        run: |
          sleep 10
          curl -f https://staging-api.autodreamapplier.com/health || exit 1
