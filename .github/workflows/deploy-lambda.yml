name: Deploy Lambda Functions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: git SHA)'
        required: false
        default: ''

permissions:
  id-token: write   # For OIDC auth with AWS
  contents: read

jobs:
  deploy-lambda:
    name: Build & Deploy Lambda Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        service:
          - name: api-gateway
            memory: 256
            timeout: 30
          - name: job-discovery
            memory: 256
            timeout: 840
          - name: job-matcher
            memory: 256
            timeout: 300
          - name: followup-scheduler
            memory: 128
            timeout: 120
      # Build all services in parallel
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "tag=${TAG:0:12}" >> $GITHUB_OUTPUT
          echo "Using image tag: ${TAG:0:12}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (multi-platform)
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/lambda/${{ matrix.service.name }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/autodream/${{ matrix.service.name }}:${{ steps.tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/autodream/${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Update Lambda function image
        run: |
          FUNCTION_NAME="autodream-${{ matrix.service.name }}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/autodream/${{ matrix.service.name }}:${{ steps.tag.outputs.tag }}"

          echo "Updating $FUNCTION_NAME to $IMAGE_URI"

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --architectures arm64 \
            --region "${{ secrets.AWS_REGION }}"

          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "${{ secrets.AWS_REGION }}"

          echo "✓ $FUNCTION_NAME updated successfully"

  notify-deploy:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy-lambda
    if: always()

    steps:
      - name: Deployment summary
        run: |
          if [ "${{ needs.deploy-lambda.result }}" == "success" ]; then
            echo "✅ All Lambda functions deployed successfully"
            echo "Commit: ${{ github.sha }}"
            echo "Actor: ${{ github.actor }}"
          else
            echo "❌ Lambda deployment failed"
            exit 1
          fi
