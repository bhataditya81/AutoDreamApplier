name: Deploy EC2 Services

on:
  push:
    branches: [main]
    paths:
      - 'cmd/apply-engine/**'
      - 'cmd/browser-pool/**'
      - 'internal/application/**'
      - 'internal/ats/**'
      - 'internal/browser/**'
      - 'internal/notification/**'
      - 'deployments/ec2/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even without file changes'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  build-ec2-images:
    name: Build EC2 Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        service:
          - apply-engine
          - browser-pool
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA:0:12}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/ec2/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/autodream/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/autodream/${{ matrix.service }}:latest
          cache-from: type=gha,scope=ec2-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ec2-${{ matrix.service }}

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-ec2-images
    timeout-minutes: 35
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update image tag in SSM
        run: |
          aws ssm put-parameter \
            --name /autodream/image_tag \
            --value "${{ needs.build-ec2-images.outputs.image_tag }}" \
            --type String \
            --overwrite \
            --region "${{ secrets.AWS_REGION }}"

      - name: Copy docker-compose.yml to EC2
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
        run: |
          echo "$EC2_SSH_PRIVATE_KEY" > /tmp/ec2-key.pem
          chmod 600 /tmp/ec2-key.pem

          scp -i /tmp/ec2-key.pem \
            -o StrictHostKeyChecking=no \
            deployments/ec2/docker-compose.yml \
            "ec2-user@$EC2_PUBLIC_IP:/opt/autodream/docker-compose.yml"

      - name: Pull new images and restart services
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
          ECR_REGISTRY: ${{ needs.build-ec2-images.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.build-ec2-images.outputs.image_tag }}
        run: |
          ssh -i /tmp/ec2-key.pem \
            -o StrictHostKeyChecking=no \
            "ec2-user@$EC2_PUBLIC_IP" << 'SSHEOF'
              set -e

              # Refresh env from SSM
              /opt/autodream/update-env.sh

              # Login to ECR
              source /opt/autodream/.env
              aws ecr get-login-password --region $AWS_REGION | \
                docker login --username AWS --password-stdin $ECR_REGISTRY

              # Pull new images
              cd /opt/autodream
              docker compose pull

              # Rolling restart (browser-pool first, then apply-engine)
              docker compose up -d --no-deps browser-pool
              sleep 5
              docker compose up -d --no-deps apply-engine

              # Cleanup old images
              docker image prune -f

              echo "Deploy complete: $IMAGE_TAG"
          SSHEOF

          rm -f /tmp/ec2-key.pem

      - name: Health check
        env:
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
        run: |
          sleep 10
          # Check apply-engine is responding
          curl -f --retry 3 --retry-delay 5 \
            "http://$EC2_PUBLIC_IP:8084/health" || echo "Health check failed (non-blocking)"
