run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - unused
    - prealloc
    - gocritic

issues:
  exclude-rules:
    # ATS plugins intentionally share structure (same interface, different vendor)
    - linters: [dupl]
      path: ".*"
    # Test helpers don't need to propagate context
    - linters: [contextcheck]
      path: "_test\\.go"
    # Unused helpers in integration tests are kept for future use
    - linters: [unused]
      path: "_integration_test\\.go"
