# ============================================================
# Terraform — shared init template + plan/apply/destroy jobs
#
# Uses GitLab's built-in HTTP Terraform state backend.
# State is stored per-project at:
#   ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production
# ============================================================

.terraform-base:
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT:         "false"
    # TF_HTTP_* vars are read by the HTTP backend on every operation
    # (plan, apply, lock, unlock) — not just at init time.
    # This is the correct way to pass credentials in CI so that
    # each job uses its own CI_JOB_TOKEN for state locking.
    TF_HTTP_ADDRESS:        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production"
    TF_HTTP_LOCK_ADDRESS:   "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production/lock"
    TF_HTTP_UNLOCK_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production/lock"
    TF_HTTP_USERNAME:       "gitlab-ci-token"
    TF_HTTP_PASSWORD:       "${CI_JOB_TOKEN}"
    TF_HTTP_LOCK_METHOD:    "POST"
    TF_HTTP_UNLOCK_METHOD:  "DELETE"
    TF_HTTP_RETRY_WAIT_MIN: "5"
  before_script:
    - cd "${TF_ROOT}"
    - terraform init

# ── Plan — runs automatically before every deploy ─────────────────────────

terraform:plan:
  extends: .terraform-base
  stage: infra
  script:
    - terraform validate
    - |
      set +e
      terraform plan -out=tfplan -detailed-exitcode
      PLAN_EXIT=$?
      set -e
      # exit 0 = no changes, exit 2 = changes pending (both are success)
      # exit 1 = real terraform error (fail the job)
      [ $PLAN_EXIT -eq 1 ] && exit 1 || exit 0
  artifacts:
    name: "tfplan-${CI_COMMIT_SHA}"
    paths:
      - "${TF_ROOT}/tfplan"
    expire_in: 1 hour
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $PIPELINE_TYPE == "deploy"'

# ── Apply — manual gate after plan ────────────────────────────────────────

terraform:apply:
  extends: .terraform-base
  stage: infra
  needs: ["terraform:plan"]
  when: manual
  allow_failure: false   # blocks the pipeline — build stage waits for apply
  script:
    - terraform apply -auto-approve tfplan
    - |
      # Extract outputs and store in SSM (already done by Terraform resources)
      # Export for downstream jobs in this pipeline
      EC2_IP=$(terraform output -raw ec2_public_ip)
      API_URL=$(terraform output -raw api_endpoint)
      echo "EC2_PUBLIC_IP=${EC2_IP}" >> "${CI_PROJECT_DIR}/${TF_ROOT}/deploy.env"
      echo "API_ENDPOINT=${API_URL}" >> "${CI_PROJECT_DIR}/${TF_ROOT}/deploy.env"
      echo "Terraform apply complete."
      echo "  EC2 IP       : ${EC2_IP}"
      echo "  API endpoint : ${API_URL}"
  artifacts:
    reports:
      dotenv: "${TF_ROOT}/deploy.env"
    expire_in: 2 hours
  environment:
    name: production
    url: $API_ENDPOINT
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $PIPELINE_TYPE == "deploy"'
