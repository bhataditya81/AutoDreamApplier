.deploy-ecs:
  extends: .aws-cli
  variables:
    ECS_CONTAINER_NAME: app
  before_script:
    - |
      if ! command -v jq >/dev/null 2>&1; then
        if command -v yum >/dev/null 2>&1; then
          yum install -y jq
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y jq
        else
          echo "jq is required but no supported package manager found" >&2
          exit 1
        fi
      fi
    - aws sts get-caller-identity
  script:
    - |
      set -euo pipefail

      if [ -z "${ECS_CLUSTER:-}" ] || [ -z "${ECS_SERVICE:-}" ] || [ -z "${ECS_TASKDEF_FAMILY:-}" ] || [ -z "${ECS_CONTAINER_NAME:-}" ] || [ -z "${IMAGE_URI:-}" ]; then
        echo "Missing required variables: ECS_CLUSTER, ECS_SERVICE, ECS_TASKDEF_FAMILY, ECS_CONTAINER_NAME, IMAGE_URI" >&2
        exit 1
      fi

      echo "Deploying ${ECS_SERVICE} to ${ECS_CLUSTER}"
      echo "Using image ${IMAGE_URI}"

      CURRENT_JSON="$(aws ecs describe-task-definition --task-definition "${ECS_TASKDEF_FAMILY}")"
      NEW_TASKDEF="$(echo "${CURRENT_JSON}" | jq -r '.taskDefinition
        | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
        | (.containerDefinitions[] | select(.name==env.ECS_CONTAINER_NAME) | .image) = env.IMAGE_URI')"

      NEW_ARN="$(aws ecs register-task-definition --cli-input-json "${NEW_TASKDEF}" | jq -r '.taskDefinition.taskDefinitionArn')"
      echo "Registered ${NEW_ARN}"

      aws ecs update-service \
        --cluster "${ECS_CLUSTER}" \
        --service "${ECS_SERVICE}" \
        --task-definition "${NEW_ARN}" \
        --force-new-deployment >/dev/null

      aws ecs wait services-stable --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}"

.deploy-ecs:dev:
  extends: .deploy-ecs
  stage: deploy_dev
  environment:
    name: dev
  when: manual
  rules: !reference [.rules, default_branch, rules]

.deploy-ecs:prod:
  extends: .deploy-ecs
  stage: deploy_prod
  environment:
    name: prod
  when: manual
  rules: !reference [.rules, tag, rules]

# -------------------------
# Per-service ECS deploy jobs
# -------------------------
deploy:ecs:dev:api-gateway:
  extends: .deploy-ecs:dev
  variables:
    ECS_CLUSTER: $ECS_CLUSTER_DEV
    ECS_SERVICE: api-gateway
    ECS_TASKDEF_FAMILY: api-gateway
    ECS_CONTAINER_NAME: api-gateway
    IMAGE_URI: ${AWS_ACCOUNT_ID_DEV}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_PREFIX:-autodreamapplier}/api-gateway:${CI_COMMIT_SHA}
  needs: ["docker:api-gateway"]

