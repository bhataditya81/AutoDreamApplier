# ============================================================
# Docker build + ECR push — reusable template
#
# Each concrete job extends .docker-build-ecr and sets:
#   SERVICE_NAME  — ECR repo suffix (e.g. api-gateway)
#   DOCKERFILE    — path to Dockerfile
#   CONTEXT       — docker build context (default: ".")
#   PLATFORM      — linux/amd64 (Lambda) | linux/arm64 (EC2 t4g)
# ============================================================

.docker-build-ecr:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST:        tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    PLATFORM:           linux/amd64
    CONTEXT:            "."
  before_script:
    - apk add --no-cache aws-cli
    - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
    - aws ecr get-login-password --region "${AWS_REGION}" |
        docker login --username AWS --password-stdin "${ECR_REGISTRY}"
  script:
    - |
      set -euo pipefail
      ECR_REPO="${ECR_REGISTRY}/${ECR_REPO_PREFIX}/${SERVICE_NAME}"
      IMAGE_SHA="${ECR_REPO}:${CI_COMMIT_SHA}"
      IMAGE_LATEST="${ECR_REPO}:latest"

      echo "Building ${SERVICE_NAME} (${PLATFORM}) → ${IMAGE_SHA}"

      docker build \
        --platform "${PLATFORM}" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "${IMAGE_LATEST}" \
        -f "${DOCKERFILE}" \
        -t "${IMAGE_SHA}" \
        -t "${IMAGE_LATEST}" \
        "${CONTEXT}"

      docker push "${IMAGE_SHA}"
      docker push "${IMAGE_LATEST}"

      # Export image URI for downstream deploy jobs
      SAFE_NAME=$(echo "${SERVICE_NAME}" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
      echo "ECR_IMAGE_${SAFE_NAME}=${IMAGE_SHA}" >> build.env
      echo "Pushed ${IMAGE_SHA}"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 2 hours

# ── Lambda services (x86_64) ──────────────────────────────────────────────

.build-rule: &build-rule
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $PIPELINE_TYPE == "deploy"'
    - when: never

build:api-gateway:
  extends: .docker-build-ecr
  variables:
    SERVICE_NAME: api-gateway
    DOCKERFILE:   deployments/lambda/api-gateway/Dockerfile
