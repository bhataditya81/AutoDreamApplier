go:fmt:
  stage: validate
  image: golang:1.25-alpine
  rules: !reference [.rules, ci, rules]
  before_script:
    - apk add --no-cache git
  script:
    - test -z "$(gofmt -l . | tr -d '\r')"
  cache:
    key:
      files:
        - go.sum
    paths:
      - /go/pkg/mod
      - /root/.cache/go-build

go:lint:
  stage: validate
  image: golang:1.25-alpine
  rules: !reference [.rules, ci, rules]
  before_script:
    - apk add --no-cache git
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.59.1
  script:
    - golangci-lint run ./...
  cache:
    key:
      files:
        - go.sum
    paths:
      - /go/pkg/mod
      - /root/.cache/go-build

go:test:
  stage: test
  image: golang:1.25-alpine
  rules: !reference [.rules, ci, rules]
  before_script:
    - apk add --no-cache bash make
  script:
    - make test
  cache:
    key:
      files:
        - go.sum
    paths:
      - /go/pkg/mod
      - /root/.cache/go-build

go:build:
  stage: build
  image: golang:1.25-alpine
  rules: !reference [.rules, ci, rules]
  before_script:
    - apk add --no-cache bash make
  script:
    - make build
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - bin/
  cache:
    key:
      files:
        - go.sum
    paths:
      - /go/pkg/mod
      - /root/.cache/go-build

