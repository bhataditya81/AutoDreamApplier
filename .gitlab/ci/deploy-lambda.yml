.lambda:deploy:zip:
  extends: .aws-cli
  stage: deploy_dev
  when: manual
  environment:
    name: dev
  script:
    - |
      set -euo pipefail
      if [ -z "${LAMBDA_FUNCTION_NAME:-}" ] || [ -z "${LAMBDA_ZIP_PATH:-}" ]; then
        echo "Missing required variables: LAMBDA_FUNCTION_NAME, LAMBDA_ZIP_PATH" >&2
        exit 1
      fi
      if [ ! -f "${LAMBDA_ZIP_PATH}" ]; then
        echo "Zip not found at ${LAMBDA_ZIP_PATH}" >&2
        exit 1
      fi

      aws lambda update-function-code \
        --function-name "${LAMBDA_FUNCTION_NAME}" \
        --zip-file "fileb://${LAMBDA_ZIP_PATH}" \
        --region "${AWS_REGION}"

.lambda:deploy:container:
  extends: .aws-cli
  stage: deploy_dev
  when: manual
  environment:
    name: dev
  script:
    - |
      set -euo pipefail
      if [ -z "${LAMBDA_FUNCTION_NAME:-}" ] || [ -z "${IMAGE_URI:-}" ]; then
        echo "Missing required variables: LAMBDA_FUNCTION_NAME, IMAGE_URI" >&2
        exit 1
      fi

      aws lambda update-function-code \
        --function-name "${LAMBDA_FUNCTION_NAME}" \
        --image-uri "${IMAGE_URI}" \
        --region "${AWS_REGION}"

# Notes:
# - Lambda packaging for these services requires code entrypoints (Go: Chi → APIGW adapter; Python FastAPI: Mangum).
# - Once those entrypoints exist, add build jobs that produce `dist/*.zip` (or container images) and wire them into the deploy templates above.

