<!DOCTYPE html>
<html lang="en">
<head><title>Software Engineer Jobs - ZipRecruiter</title></head>
<body>
  <div id="job-results">

    <!-- Job card 1: article with data-job-id -->
    <article class="job_result" data-job-id="zr_abc123">
      <a class="job_link jobList-title t_good" href="/jobs/zr_abc123" data-testid="job-title">
        Software Engineer
      </a>
      <span class="hiring_company_text" data-testid="job-company">Acme Corp</span>
      <span class="location" data-testid="job-location">San Francisco, CA</span>
      <span class="actual_minimum_salary" data-testid="job-salary">$120,000 - $160,000 a year</span>
      <div class="job_description">Build and maintain scalable APIs.</div>
    </article>

    <!-- Job card 2: article with data-job-id, remote job -->
    <article class="job_result" data-job-id="zr_def456">
      <a class="job_link jobList-title t_good" href="/jobs/zr_def456" data-testid="job-title">
        Senior Go Developer
      </a>
      <span class="hiring_company_text" data-testid="job-company">BetaCorp</span>
      <span class="location" data-testid="job-location">Remote</span>
      <span class="actual_minimum_salary" data-testid="job-salary">$150,000 - $200,000 a year</span>
      <div class="job_description">Design distributed microservices in Go.</div>
    </article>

    <!-- Job card 3: div with class job_result and data-job-id -->
    <div class="job_result jobList-item" data-job-id="zr_ghi789">
      <a class="job_link t_good" href="/jobs/zr_ghi789" data-testid="job-title">
        Backend Engineer
      </a>
      <span class="t_org_name" data-testid="job-company">Gamma Inc</span>
      <span class="t_city" data-testid="job-location">Austin, TX</span>
      <div class="t_job_desc">Cloud infrastructure and DevOps automation work.</div>
    </div>

  </div>
</body>
</html>
